<section class="min-h-screen px-6 py-10 max-w-xl mx-auto space-y-6">
  <button (click)="volver()" class="text-sm text-gray-300 hover:text-white inline-flex items-center gap-1">
    <lucide-icon [img]="ArrowLeft" class="w-4 h-4" /> Volver
  </button>
  <div class="space-y-3">
    <h2 class="text-2xl font-bold text-white flex items-center gap-2">
      <lucide-icon [img]="Handshake" class="w-6 h-6 text-blue-400" /> Conviértete en Aliado
    </h2>
    <p class="text-gray-400 text-sm leading-relaxed">
      Aumenta consumo, permanencia y fidelidad. Con NexTurn tus clientes esperan menos y viven más tu experiencia. Postula tu bar y recibe beneficios de visibilidad, afters aliados y promociones dirigidas.
    </p>
  </div>

  <form (ngSubmit)="enviar()" class="space-y-4" *ngIf="!enviado">
    <div class="space-y-1">
      <label class="text-xs uppercase tracking-wide text-gray-400">Tu Nombre</label>
      <input [(ngModel)]="nombre" name="nombre" type="text" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Nombre y Apellido" />
    </div>
    <div class="space-y-1">
      <label class="text-xs uppercase tracking-wide text-gray-400">Nombre del Bar</label>
      <input [(ngModel)]="bar" name="bar" type="text" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Ej: BluePulse" />
    </div>
    <div class="space-y-1">
      <label class="text-xs uppercase tracking-wide text-gray-400">Contacto (Email o Teléfono)</label>
      <input [(ngModel)]="contacto" name="contacto" type="text" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="email@bar.com / +57..." />
    </div>
    <button type="submit" [disabled]="!nombre || !bar || !contacto" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
      <lucide-icon [img]="Send" class="w-4 h-4" /> Enviar Postulación
    </button>
  </form>

  <div *ngIf="enviado" class="border border-green-600/40 bg-green-900/30 p-6 rounded-xl text-center space-y-2">
    <p class="text-green-300 font-medium">¡Solicitud enviada!</p>
    <p class="text-xs text-green-200">Te contactaremos pronto para continuar el proceso.</p>
  </div>
</section>
