<div class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
  <div class="mb-8 animate-pulse">
    <lucide-icon [img]="QrCode" class="w-24 h-24 text-purple-400 mx-auto mb-4" />
  </div>

  <h1 class="text-4xl font-bold text-white mb-3 tracking-tight">NexTurn</h1>

  <p class="text-gray-400 mb-8 text-lg leading-relaxed max-w-sm">
    Escanea el código QR del bar para unirte a la fila virtual
  </p>

  <button
    (click)="handleSimulateScan()"
    [disabled]="isScanning"
    class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold px-8 py-6 text-lg rounded-2xl shadow-lg shadow-purple-500/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
  >
    <lucide-icon [img]="Scan" [class]="isScanning ? 'animate-spin' : ''" class="h-5 w-5" />
    <span>{{ isScanning ? 'Escaneando...' : 'Escanear QR' }}</span>
  </button>

  <p class="text-xs text-gray-600 mt-6">Demo MVP - Simulación de escaneo</p>
</div>
