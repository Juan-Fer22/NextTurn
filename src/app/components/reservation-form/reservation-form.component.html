<div class="min-h-screen p-6 flex flex-col justify-center">
  <div class="mb-8 text-center">
    <h2 class="text-3xl font-bold text-white mb-2">Crea tu Reserva</h2>
    <p class="text-gray-400">Completa los datos para unirte a la fila</p>
  </div>

  <form (ngSubmit)="handleSubmit($event)" class="space-y-6">
    <div class="space-y-2">
      <label for="name" class="text-white text-base block">
        Nombre de la reserva
      </label>
      <input
        id="name"
        [(ngModel)]="name"
        name="name"
        placeholder="Tu nombre"
        required
        class="w-full bg-gray-800 border border-gray-700 text-white placeholder:text-gray-500 h-12 text-base px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
      />
    </div>

    <div class="space-y-2">
      <label class="text-white text-base block">
        Número de personas
      </label>
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="decrementPeople()"
          class="bg-gray-800 border border-gray-700 text-white hover:bg-gray-700 h-12 w-12 rounded-md transition-colors"
        >
          -
        </button>
        <div class="flex-1 text-center">
          <div class="text-3xl font-bold text-white">{{ people }}</div>
          <div class="text-xs text-gray-400 flex items-center justify-center gap-1">
            <lucide-icon [img]="Users" class="w-3 h-3" />
            <span>personas</span>
          </div>
        </div>
        <button
          type="button"
          (click)="incrementPeople()"
          class="bg-gray-800 border border-gray-700 text-white hover:bg-gray-700 h-12 w-12 rounded-md transition-colors"
        >
          +
        </button>
      </div>
    </div>

    <div class="space-y-2">
      <label for="celebration" class="text-white text-base block">
        Tipo de celebración
      </label>
      <input
        id="celebration"
        [(ngModel)]="celebration"
        name="celebration"
        placeholder="Cumpleaños, reunión, etc."
        class="w-full bg-gray-800 border border-gray-700 text-white placeholder:text-gray-500 h-12 text-base px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
      />
    </div>

    <div
      class="p-4 border-2 rounded-lg transition-all"
      [style.borderColor]="currentTypeData.color"
      [style.backgroundColor]="currentTypeData.color + '15'"
    >
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm text-gray-400 mb-1">Tu reserva será</div>
          <div class="text-xl font-bold text-white flex items-center gap-2">
            <span>{{ currentTypeData.icon }}</span>
            {{ currentTypeData.name }}
          </div>
        </div>
        <div class="text-right">
          <div class="text-sm text-gray-400">Tiempo estimado</div>
          <div class="text-2xl font-bold text-white">{{ currentTypeData.waitTime }}min</div>
        </div>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="!name"
      class="w-full h-14 text-lg font-semibold rounded-xl flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
      [style.background]="'linear-gradient(135deg, ' + currentTypeData.color + ', ' + currentTypeData.color + 'dd)'"
    >
      <lucide-icon [img]="PartyPopper" class="h-5 w-5" />
      <span>Unirme a la Fila</span>
    </button>
  </form>

  <p class="text-center text-xs text-gray-600 mt-6">Bar: {{ barCode }}</p>
</div>
